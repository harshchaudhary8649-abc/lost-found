{% extends 'base.html' %}

{% block content %}
<style>
    .profile-container {
        max-width: 600px;
        margin: 4rem auto;
        background: white;
        padding: 3rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        border: 1px solid var(--card-border);
    }

    .profile-header {
        display: flex;
        align-items: center;
        gap: 2rem;
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--card-border);
    }

    .current-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--accent-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2.5rem;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-main);
        font-weight: 500;
    }

    .form-control {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid var(--card-border);
        border-radius: 8px;
        background: #f8fafc;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--accent-primary);
        background: white;
    }
</style>

<div class="profile-container" data-aos="fade-up">
    <div class="profile-header">
        {% if request.user.userprofile.profile_image %}
            <img src="{{ request.user.userprofile.profile_image.url }}" alt="Profile Image" class="current-avatar">
        {% else %}
            <div class="current-avatar">{{ request.user.first_name|slice:":1"|upper }}</div>
        {% endif %}
        <div>
            <h2 style="font-size: 2rem; color: var(--text-main);">Update Profile</h2>
            <p style="color: var(--text-muted);">Manage your personal information and profile picture.</p>
        </div>
    </div>

    <form method="POST" action="{% url 'profile' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ request.user.first_name }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Email (Cannot be changed)</label>
            <input type="email" class="form-control" value="{{ request.user.email }}" disabled>
        </div>
        <div class="form-group">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact" class="form-control" value="{{ request.user.userprofile.contact_number }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Profile Image</label>
            <input type="file" name="profile_image" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
